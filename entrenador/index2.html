<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adivina las Notas | GuitarLab</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0e0e11;
    --bg-card: #18181d;
    --bg-panel: #212128;
    --bg-panel-hover: #292932;
    --text-main: #f4f4f6;
    --text-muted: #9e9ea9;
    --accent-emerald: #10b981;
    --accent-emerald-glow: rgba(16, 185, 129, 0.15);
    --accent-amber: #f59e0b;
    --accent-amber-glow: rgba(245, 158, 11, 0.12);
    --border-subtle: rgba(255, 255, 255, 0.08);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.5rem 1rem;
    background-image: 
      radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.06) 0%, transparent 40%);
  }

  /* Barra superior de navegación */
  .top-nav {
    max-width: 820px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.25rem;
  }

  .btn-volver {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    padding: 0.5rem 0.9rem;
    border-radius: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    transition: all 0.2s ease;
  }

  .btn-volver:hover {
    color: var(--text-main);
    border-color: rgba(16, 185, 129, 0.45);
    background: var(--bg-panel);
  }

  .app-title {
    font-family: 'Outfit', sans-serif;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .app-title span {
    color: var(--accent-emerald);
  }

  /* Contenedor principal */
  .contenedor {
    background-color: var(--bg-card);
    border: 1px solid var(--border-subtle);
    max-width: 820px;
    width: 100%;
    border-radius: 20px;
    box-shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.5);
    padding: 1.5rem;
  }

  /* Banner de Récord */
  .banner-record {
    background-color: var(--accent-amber-glow);
    border: 1px solid rgba(245, 158, 11, 0.25);
    color: #fbbf24;
    padding: 0.65rem 1rem;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    font-size: 0.88rem;
    margin-bottom: 1rem;
    gap: 0.75rem;
  }

  .btn-reset {
    background: rgba(245, 158, 11, 0.15);
    border: 1px solid rgba(245, 158, 11, 0.3);
    border-radius: 8px;
    padding: 0.35rem 0.7rem;
    cursor: pointer;
    font-size: 0.78rem;
    color: #fcd34d;
    font-weight: 600;
    font-family: inherit;
    transition: all 0.2s ease;
  }

  .btn-reset:hover {
    background: rgba(245, 158, 11, 0.28);
  }

  /* Panel de Configuración */
  .panel-config {
    background-color: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 0.85rem 1rem;
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-items: center;
    justify-content: space-between;
    font-size: 0.88rem;
    color: var(--text-muted);
    margin-bottom: 1.15rem;
  }

  .panel-config label {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    cursor: pointer;
    color: var(--text-main);
    font-weight: 500;
  }

  .panel-config input[type="checkbox"] {
    accent-color: var(--accent-emerald);
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  .panel-config input[type="number"],
  .panel-config select {
    background-color: var(--bg-dark);
    color: var(--text-main);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 0.35rem 0.6rem;
    font-family: inherit;
    font-size: 0.85rem;
    outline: none;
  }

  .panel-config input[type="number"]:focus,
  .panel-config select:focus {
    border-color: var(--accent-emerald);
  }

  .panel-config input[type="number"]:disabled {
    opacity: 0.45;
  }

  /* Controles del Juego */
  .controles {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.85rem;
    margin-bottom: 1.15rem;
    flex-wrap: wrap;
  }

  button.btn-accion {
    padding: 0.6rem 1.35rem;
    font-size: 0.92rem;
    font-weight: 600;
    font-family: inherit;
    border: none;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    transition: transform 0.15s ease, background-color 0.2s ease, opacity 0.2s ease;
  }

  button.btn-accion:active:not(:disabled) {
    transform: scale(0.97);
  }

  #btnIniciar {
    background-color: var(--accent-emerald);
    color: #06281e;
    font-weight: 700;
  }

  #btnIniciar:hover:not(:disabled) {
    background-color: #34d399;
  }

  #btnIniciar:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  #btnParar {
    background-color: rgba(239, 68, 68, 0.18);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.35);
  }

  #btnParar:hover:not(:disabled) {
    background-color: rgba(239, 68, 68, 0.3);
  }

  #btnParar:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .reloj {
    font-family: 'Outfit', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--accent-emerald);
    background: var(--accent-emerald-glow);
    border: 1px solid rgba(16, 185, 129, 0.25);
    padding: 0.45rem 1rem;
    border-radius: 10px;
    min-width: 125px;
    text-align: center;
  }

  /* Lienzo del Pentagrama y Mástil */
  .scroll-canvas {
    width: 100%;
    overflow-x: auto;
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    background: #fcfcfd;
    margin-bottom: 1rem;
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.08);
  }

  canvas {
    display: block;
    margin: 0 auto;
  }

  /* Mensajes de Feedback */
  .feedback {
    text-align: center;
    font-size: 1rem;
    font-weight: 600;
    min-height: 26px;
    margin-bottom: 1rem;
    color: var(--text-main);
  }

  /* Botonera de Notas */
  .botonera-notas {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.55rem;
    margin-bottom: 1.25rem;
  }

  .btn-nota {
    min-width: 74px;
    height: 48px;
    padding: 0 0.75rem;
    font-family: 'Outfit', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    background-color: var(--bg-panel);
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-nota:hover:not(:disabled) {
    background-color: var(--accent-emerald-glow);
    border-color: var(--accent-emerald);
    color: #34d399;
    transform: translateY(-2px);
  }

  .btn-nota:active:not(:disabled) {
    transform: translateY(0);
  }

  .btn-nota:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Estadísticas inferiores */
  .estadisticas {
    text-align: center;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    padding: 0.75rem 1rem;
    border-radius: 12px;
  }

  @media (max-width: 600px) {
    .contenedor {
      padding: 1.1rem;
    }
    .panel-config {
      flex-direction: column;
      align-items: flex-start;
    }
    .btn-nota {
      min-width: 64px;
      height: 44px;
    }
  }
</style>
</head>

<body>

<nav class="top-nav">
  <a href="../index.html" class="btn-volver">← Volver al inicio</a>
  <div class="app-title"><span>●</span> Adivina las Notas</div>
</nav>

<div class="contenedor">
  <div class="banner-record">
    <span id="lblRecord">🏆 Mejor histórico: Sin registros aún</span>
    <button class="btn-reset" onclick="reiniciarRecord()">🗑️ Reiniciar récord</button>
  </div>

  <div class="panel-config">
    <label>
      <input type="checkbox" id="chkTiempo" onchange="toggleTiempo()"> Tiempo (s):
      <input type="number" id="numSegundos" value="60" min="10" max="600" step="10" style="width: 62px;" disabled onchange="toggleTiempo()">
    </label>
    <label><input type="checkbox" id="chkNombres" checked onchange="redibujar()"> Nombre arriba</label>
    <label><input type="checkbox" id="chkGuitarra" checked onchange="redibujar()"> Guitarra abajo</label>
    <select id="selPosicion" onchange="redibujar()">
      <option value="pos1">Posición I (Trastes 0-3)</option>
      <option value="pos5">Posición V (Trastes 4-8)</option>
    </select>
  </div>

  <div class="controles">
    <button id="btnIniciar" class="btn-accion" onclick="iniciarJuego()">▶ Iniciar</button>
    <button id="btnParar" class="btn-accion" onclick="pararJuego(false)" disabled>⏹ Parar</button>
    <div id="lblReloj" class="reloj">Tiempo: ∞</div>
  </div>

  <div class="scroll-canvas" id="scrollContainer">
    <canvas id="canvasPentagrama" width="720" height="245"></canvas>
  </div>

  <div id="lblFeedback" class="feedback">Configura tus opciones y pulsa 'Iniciar'</div>
  <div class="botonera-notas" id="panelBotones"></div>
  <div id="lblStats" class="estadisticas">Aciertos: 0 | Intentos: 0 | Nota: -</div>
</div>

<script>
  const notasDisponibles = [
    { nombre: "Do",  y: 175, linea: true,  frec: 261.63, pos1: "5ª-T3", pos5: "6ª-T8" },
    { nombre: "Re",  y: 165, linea: false, frec: 293.66, pos1: "4ª-0",  pos5: "5ª-T5" },
    { nombre: "Mi",  y: 155, linea: false, frec: 329.63, pos1: "4ª-T2", pos5: "5ª-T7" },
    { nombre: "Fa",  y: 145, linea: false, frec: 349.23, pos1: "4ª-T3", pos5: "5ª-T8" },
    { nombre: "Sol", y: 135, linea: false, frec: 392.00, pos1: "3ª-0",  pos5: "4ª-T5" },
    { nombre: "La",  y: 125, linea: false, frec: 440.00, pos1: "3ª-T2", pos5: "4ª-T7" },
    { nombre: "Si",  y: 115, linea: false, frec: 493.88, pos1: "2ª-0",  pos5: "3ª-T4" },
    { nombre: "Do",  y: 105, linea: false, frec: 523.25, pos1: "2ª-T1", pos5: "3ª-T5" },
    { nombre: "Re",  y: 95,  linea: false, frec: 587.33, pos1: "2ª-T3", pos5: "3ª-T7" },
    { nombre: "Mi",  y: 85,  linea: false, frec: 659.25, pos1: "1ª-0",  pos5: "2ª-T5" },
    { nombre: "Fa",  y: 75,  linea: false, frec: 698.46, pos1: "1ª-T1", pos5: "2ª-T6" },
    { nombre: "Sol", y: 65,  linea: false, frec: 783.99, pos1: "1ª-T3", pos5: "2ª-T8" }
  ];

  const frecuenciasBotones = {
    "Do": 261.63, "Re": 293.66, "Mi": 329.63,
    "Fa": 349.23, "Sol": 392.00, "La": 440.00, "Si": 493.88
  };

  let jugando = false;
  let aciertos = 0;
  let intentos = 0;
  let notaActual = null;
  let historial = [];
  let tiempoRestante = 0;
  let timerInterval = null;
  let audioCtx = null;

  const panelBotones = document.getElementById("panelBotones");
  ["Do", "Re", "Mi", "Fa", "Sol", "La", "Si"].forEach(nombre => {
    const btn = document.createElement("button");
    btn.className = "btn-nota";
    btn.textContent = nombre;
    btn.disabled = true;
    btn.onclick = () => verificarRespuesta(nombre);
    panelBotones.appendChild(btn);
  });

  function reproducirSonido(frecuencia, duracion) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ahora = audioCtx.currentTime;
    const armonicos = [1, 2, 3];
    const pesos = [0.4, 0.2, 0.08];

    armonicos.forEach((armonico, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "sine";
      osc.frequency.setValueAtTime(frecuencia * armonico, ahora);

      gain.gain.setValueAtTime(pesos[idx], ahora);
      gain.gain.exponentialRampToValueAtTime(0.001, ahora + duracion);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(ahora);
      osc.stop(ahora + duracion);
    });
  }

  function cargarRecord() {
    const data = localStorage.getItem("record_notas_web");
    return data ? JSON.parse(data) : { nota: 0, porcentaje: 0, aciertos: 0, intentos: 0 };
  }

  function actualizarBannerRecord() {
    const rec = cargarRecord();
    const lbl = document.getElementById("lblRecord");
    if (rec.intentos === 0) {
      lbl.textContent = "🏆 Mejor histórico: Sin registros aún";
    } else {
      lbl.textContent = `🏆 Mejor histórico: Nota ${rec.nota.toFixed(1)}/10 (${rec.porcentaje.toFixed(0)}% - ${rec.aciertos}/${rec.intentos} aciertos)`;
    }
  }

  function reiniciarRecord() {
    if (confirm("¿Seguro que quieres borrar el mejor resultado histórico?")) {
      localStorage.removeItem("record_notas_web");
      actualizarBannerRecord();
    }
  }

  function toggleTiempo() {
    const usar = document.getElementById("chkTiempo").checked;
    const inputSeg = document.getElementById("numSegundos");
    const lblReloj = document.getElementById("lblReloj");
    inputSeg.disabled = !usar || jugando;
    lblReloj.textContent = usar ? `Tiempo: ${inputSeg.value}s` : "Tiempo: ∞";
  }

  function redibujar() {
    const canvas = document.getElementById("canvasPentagrama");
    const ctx = canvas.getContext("2d");
    const espacio = 72;
    const margenIzq = 120;

    canvas.width = Math.max(720, margenIzq + (historial.length + 2) * espacio);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "#18181d";
    ctx.lineWidth = 2;
    for (let y = 75; y <= 155; y += 20) {
      ctx.beginPath();
      ctx.moveTo(20, y);
      ctx.lineTo(canvas.width - 20, y);
      ctx.stroke();
    }

    ctx.fillStyle = "#18181d";
    ctx.font = "75px Arial";
    ctx.fillText("𝄞", 35, 142);

    const mostrarNombres = document.getElementById("chkNombres").checked;
    const mostrarGuitarra = document.getElementById("chkGuitarra").checked;
    const posKey = document.getElementById("selPosicion").value;

    historial.forEach((item, idx) => {
      const x = margenIzq + idx * espacio;
      const y = item.y;
      ctx.strokeStyle = item.color;
      ctx.fillStyle = item.color;
      ctx.lineWidth = 2;

      if (item.linea) {
        ctx.beginPath();
        ctx.moveTo(x - 20, y);
        ctx.lineTo(x + 20, y);
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.ellipse(x, y, 11, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      if (y >= 115) {
        ctx.moveTo(x + 11, y);
        ctx.lineTo(x + 11, y - 50);
      } else {
        ctx.moveTo(x - 11, y);
        ctx.lineTo(x - 11, y + 50);
      }
      ctx.stroke();

      if (item.respondida && mostrarNombres) {
        ctx.font = "bold 13px Inter, Arial";
        ctx.textAlign = "center";
        ctx.fillText(item.nombre, x, 30);
      }

      if (item.respondida && mostrarGuitarra) {
        ctx.fillStyle = "#059669";
        ctx.font = "bold 12px Inter, Arial";
        ctx.textAlign = "center";
        ctx.fillText(item[posKey], x, 222);
      }
    });

    const scrollContainer = document.getElementById("scrollContainer");
    scrollContainer.scrollLeft = scrollContainer.scrollWidth;
  }

  function iniciarJuego() {
    jugando = true;
    aciertos = 0;
    intentos = 0;
    historial = [];

    document.getElementById("btnIniciar").disabled = true;
    document.getElementById("btnParar").disabled = false;
    document.getElementById("numSegundos").disabled = true;
    document.querySelectorAll(".btn-nota").forEach(b => b.disabled = false);

    const fb = document.getElementById("lblFeedback");
    fb.textContent = "¿Qué nota es?";
    fb.style.color = "#f4f4f6";

    actualizarStats();

    if (document.getElementById("chkTiempo").checked) {
      tiempoRestante = parseInt(document.getElementById("numSegundos").value, 10);
      document.getElementById("lblReloj").textContent = `Tiempo: ${tiempoRestante}s`;
      timerInterval = setInterval(() => {
        tiempoRestante--;
        document.getElementById("lblReloj").textContent = `Tiempo: ${tiempoRestante}s`;
        if (tiempoRestante <= 0) pararJuego(true);
      }, 1000);
    } else {
      document.getElementById("lblReloj").textContent = "Tiempo: ∞";
    }

    siguienteNota();
  }

  function siguienteNota() {
    if (!jugando) return;
    let nueva = notasDisponibles[Math.floor(Math.random() * notasDisponibles.length)];
    while (nueva === notaActual) {
      nueva = notasDisponibles[Math.floor(Math.random() * notasDisponibles.length)];
    }
    notaActual = nueva;
    historial.push({ ...nueva, color: "#18181d", respondida: false });
    redibujar();
  }

  function verificarRespuesta(respuesta) {
    if (!jugando || historial.length === 0) return;

    intentos++;
    const actual = historial[historial.length - 1];
    actual.respondida = true;
    const posKey = document.getElementById("selPosicion").value;
    const posTexto = actual[posKey];
    const fb = document.getElementById("lblFeedback");

    if (respuesta === actual.nombre) {
      aciertos++;
      actual.color = "#059669";
      fb.textContent = `¡Correcto! Era ${actual.nombre} (${posTexto})`;
      fb.style.color = "#34d399";
      reproducirSonido(actual.frec, 0.85);
      if (navigator.vibrate) navigator.vibrate(30);
    } else {
      actual.color = "#dc2626";
      fb.textContent = `Incorrecto (pulsaste ${respuesta}). Era ${actual.nombre} (${posTexto})`;
      fb.style.color = "#f87171";
      reproducirSonido(frecuenciasBotones[respuesta], 0.25);
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    }

    redibujar();
    actualizarStats();
    siguienteNota();
  }

  function actualizarStats() {
    const lbl = document.getElementById("lblStats");
    if (intentos === 0) {
      lbl.textContent = "Aciertos: 0 | Intentos: 0 | Nota: -";
    } else {
      const porcentaje = (aciertos / intentos) * 100;
      const nota = (aciertos / intentos) * 10;
      lbl.textContent = `Aciertos: ${aciertos} | Intentos: ${intentos} | Nota: ${nota.toFixed(1)}/10 (${porcentaje.toFixed(0)}%)`;
    }
  }

  function pararJuego(porTiempo) {
    jugando = false;
    clearInterval(timerInterval);

    document.getElementById("btnIniciar").disabled = false;
    document.getElementById("btnParar").disabled = true;
    document.querySelectorAll(".btn-nota").forEach(b => b.disabled = true);
    toggleTiempo();

    const fb = document.getElementById("lblFeedback");
    if (intentos > 0) {
      const porcentaje = (aciertos / intentos) * 100;
      const nota = (aciertos / intentos) * 10;
      const rec = cargarRecord();

      if (nota > rec.nota || (nota === rec.nota && aciertos > rec.aciertos)) {
        localStorage.setItem("record_notas_web", JSON.stringify({
          nota: nota,
          porcentaje: porcentaje,
          aciertos: aciertos,
          intentos: intentos
        }));
        actualizarBannerRecord();
        fb.textContent = `${porTiempo ? "⏰ ¡Tiempo agotado! " : "⏹ Partida terminada. "}🎉 ¡Nuevo récord: ${nota.toFixed(1)}/10!`;
        fb.style.color = "#fbbf24";
      } else {
        fb.textContent = `${porTiempo ? "⏰ ¡Tiempo agotado! " : "⏹ Partida terminada. "}Nota final: ${nota.toFixed(1)}/10`;
        fb.style.color = "#f4f4f6";
      }
    } else {
      fb.textContent = porTiempo ? "⏰ ¡Tiempo agotado! Sin intentos registrados." : "Partida detenida.";
      fb.style.color = "#9e9ea9";
    }
  }

  // Inicialización al cargar
  actualizarBannerRecord();
  redibujar();
</script>

</body>
</html>
